# =====================================================================
# Configuração do Googol (Sistemas Distribuídos 2026/27 - Meta 1)
# Alterar este ficheiro NÃO exige recompilar (requisito obrigatório, -5).
# Cada máquina tem a sua cópia: muda-se pelo menos o rmi.hostname.
# =====================================================================

# --- RMI ---
# IP desta máquina na rede local (ex.: 192.168.1.10).
# IMPORTANTE: se ficar "localhost", os outros PCs não conseguem
# contactar os objetos remotos criados nesta máquina.
rmi.hostname=localhost

# --- Gateway ---
# Onde está a Gateway (IP da máquina #1 na defesa).
gateway.host=localhost
gateway.port=1099
gateway.name=googol-gateway
# Ficheiro onde a Gateway guarda a fila de URLs e as pesquisas mais comuns,
# para recuperar se avariar.
gateway.state.file=data/gateway_state.dat
# De quanto em quanto tempo (ms) a Gateway verifica se os Barrels estão vivos
# e se o tamanho dos índices mudou (só avisa os clientes se algo mudar).
gateway.monitor.interval.ms=2000
# De quanto em quanto tempo (ms) a Gateway grava a fila e as pesquisas, se mudaram
# (os pedidos de indexação do utilizador são gravados de imediato). Opcional: 1000 por omissão.
gateway.save.interval.ms=1000

# --- Barrel ---
# Identificador deste Barrel (barrel1 na máquina #1, barrel2 na máquina #2).
barrel.id=barrel2
# Ficheiro onde o Barrel guarda o índice de forma persistente.
barrel.data.file=data/barrel2.dat
# De quanto em quanto tempo (ms) o Barrel volta a anunciar-se à Gateway
# (permite à Gateway reencontrar os Barrels se reiniciar após uma avaria).
barrel.register.interval.ms=5000

# --- Downloader ---
# Identificador deste Downloader (downloader1, downloader2, ...).
downloader.id=downloader1
# Número de palavras da citação mostrada nos resultados.
downloader.citation.words=30
# Tempo (ms) entre tentativas quando um Barrel não responde.
downloader.retry.delay.ms=2000
# Tempo máximo (ms) à espera de uma página Web.
downloader.timeout.ms=5000
# Número de threads (downloads em paralelo) neste Downloader.
downloader.threads=2
# Barrels que têm de receber TODAS as páginas (grupo do reliable multicast).
# Separados por vírgulas; devem corresponder aos barrel.id de cada máquina.
downloader.barrels=barrel1,barrel2

# --- Cliente ---
# Quantas vezes o cliente tenta de novo quando a Gateway não responde.
client.retry.attempts=5
# Tempo (ms) entre tentativas.
client.retry.delay.ms=2000
# De quanto em quanto tempo (ms) o cliente confirma a subscrição das estatísticas
# (se a Gateway reiniciar, a subscrição é refeita sozinha).
client.stats.resubscribe.ms=3000
